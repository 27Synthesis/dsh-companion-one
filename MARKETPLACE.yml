url: https://github.com/27Synthesis/dsh-companion-one
name: 27Synthesis/dsh-companion-one
category: memory
description:
  en: 'A five-region plastic persona for the dsh-go native phone UI: perception, emotion, executive, narrative and expression interact in parallel, consolidate through reaction, deliberation and narrative layers, and feed back through four valves (attention, explanation, emotion, goal) — an attempt to let the model grow a picture of itself through conversation. Around it: seven-layer local memory with per-person scope and fact validity, built-in context compression with restorable block refs, communication-style cards learned from your own words, companionship boundaries, and a first-person heart voice. Already using another memory plugin? It read-only merges Mnemon runtime memory, project documents and other SQLite memory tables — sources untouched, duplicates merged. The learning centre studies real comments on Bilibili and distils style packs to fight AI tone and formulaic speech. One plugin, one SQLite file via node:sqlite + FTS5, zero native builds, no traffic proxying, and no extra model calls by default; token-frugal by design: the static guide registers once, dynamic context is injected one-shot within explicit budgets (300/120/200/150 tokens), and summaries are accepted only when shorter; all data stays on the device.'
  zh: '面向 dsh-go 手机原生界面的五区可塑人格：感知、情绪、执行、叙事、表达五区并行交互，经过反应层、推演层、叙事层三层固化，再由注意、解释、情绪、目标四个阀门反向调节——尝试让模型在对话里慢慢长出对自己的认识。外围还有七层本地记忆（按人隔离、事实带有效期与失效）、内置上下文压缩（块引用可检索可还原）、从你原话学习的沟通风格卡、陪伴分寸与第一人称心声。已经装了别的记忆插件？它只读合并 Mnemon 运行时记忆、项目文档和其它 SQLite 记忆表，源数据不动、重复自动合并。学习中心会去 B 站学真人评论、蒸馏文风包，专治 AI 腔和鱼八股。一个插件、一个 SQLite 文件（node:sqlite + FTS5）、零原生编译、不接管网络、默认不增加额外模型调用；省 token 是默认设计：静态导引只注册一次，动态上下文按 300/120/200/150 token 预算一次性注入，摘要只收更短的；数据全部留在本机。'
