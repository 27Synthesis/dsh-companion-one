<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="companion-one — 五区可塑人格">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090F"/>
      <stop offset="0.52" stop-color="#0A101D"/>
      <stop offset="1" stop-color="#0D1527"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9E5E" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FF9E5E" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF9E5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E7BFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#6E7BFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6E7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB262" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFB262" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFB262" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D4FF"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD39B"/>
      <stop offset="1" stop-color="#FF8E5C"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#FFFFFF" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="1030" cy="120" rx="560" ry="380" fill="url(#glowWarm)"/>
  <ellipse cx="110" cy="628" rx="470" ry="330" fill="url(#glowCool)"/>

  <!-- eyebrow -->
  <g font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif">
    <circle cx="97" cy="85" r="4" fill="#FFB262"/>
    <text x="114" y="90" font-size="13.5" font-weight="700" letter-spacing="3.4" fill="#8B99BA">DSH · COMPANION LAYER · V0.1.0</text>
  </g>

  <!-- title -->
  <g font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif">
    <text x="86" y="216" font-size="86" font-weight="700" fill="url(#titleGrad)" letter-spacing="-1.5">companion<tspan fill="url(#amberGrad)">-one</tspan></text>
    <text x="90" y="292" font-size="38" font-weight="700" fill="#EDF2FF" letter-spacing="1">让对话，慢慢长出一个「我」。</text>
    <text x="92" y="338" font-size="16.5" fill="#93A1C4" letter-spacing="0.2">A five-region persona that grows through conversation.</text>
  </g>

  <!-- feature chips -->
  <g font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="15">
    <rect x="92" y="378" width="100" height="40" rx="20" fill="#FFB262" fill-opacity="0.10" stroke="#FFB262" stroke-opacity="0.38"/>
    <text x="142" y="403" text-anchor="middle" fill="#FFD3A2" font-weight="700">五区人格</text>
    <rect x="200" y="378" width="100" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text x="250" y="403" text-anchor="middle" fill="#C9D5F2">记忆合并</text>
    <rect x="308" y="378" width="100" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text x="358" y="403" text-anchor="middle" fill="#C9D5F2">文风学习</text>
    <rect x="416" y="378" width="100" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text x="466" y="403" text-anchor="middle" fill="#C9D5F2">七层记忆</text>
    <rect x="524" y="378" width="85" height="40" rx="20" fill="#6FE3C1" fill-opacity="0.08" stroke="#6FE3C1" stroke-opacity="0.30"/>
    <text x="566.5" y="403" text-anchor="middle" fill="#B9F0DF">活人感</text>
  </g>

  <line x1="92" y1="456" x2="640" y2="456" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="92" y="497" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#8B99BB" letter-spacing="0.3">5 区并行 · 7 层记忆 · 13 个工具 · 0 个外部依赖</text>

  <text x="92" y="596" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13.5" fill="#7784A4" letter-spacing="0.4">github.com/27Synthesis/dsh-companion-one</text>
  <text x="1188" y="596" text-anchor="end" font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#6D7A9A" letter-spacing="0.3">MIT · SQLite + FTS5 · zero native builds</text>

  <!-- five-region ring -->
  <g font-family="'Noto Sans SC','Noto Sans CJK SC',sans-serif">
    <circle cx="1010" cy="330" r="158" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-dasharray="3 7"/>
    <g stroke="#FFFFFF" stroke-opacity="0.10">
      <line x1="1010" y1="330" x2="1010" y2="172"/>
      <line x1="1010" y1="330" x2="1160" y2="281"/>
      <line x1="1010" y1="330" x2="1103" y2="458"/>
      <line x1="1010" y1="330" x2="917" y2="458"/>
      <line x1="1010" y1="330" x2="860" y2="281"/>
    </g>
    <g fill="#FFB262" fill-opacity="0.55">
      <path d="M-3,-4 L4,0 L-3,4 Z" transform="translate(1103 202) rotate(36)"/>
      <path d="M-3,-4 L4,0 L-3,4 Z" transform="translate(1160 379) rotate(108)"/>
      <path d="M-3,-4 L4,0 L-3,4 Z" transform="translate(1010 488) rotate(180)"/>
      <path d="M-3,-4 L4,0 L-3,4 Z" transform="translate(860 379) rotate(252)"/>
      <path d="M-3,-4 L4,0 L-3,4 Z" transform="translate(917 202) rotate(324)"/>
    </g>
    <circle cx="1010" cy="330" r="92" fill="url(#coreGlow)"/>
    <circle cx="1010" cy="330" r="52" fill="#0E1829" stroke="#FFB262" stroke-opacity="0.45"/>
    <text x="1010" y="344" text-anchor="middle" font-size="40" font-weight="700" fill="#FFD6AC">我</text>
    <text x="1010" y="364" text-anchor="middle" font-size="8.5" letter-spacing="3" fill="#C79A6B">SELF</text>

    <!-- nodes -->
    <g>
      <rect x="931" y="143" width="158" height="58" rx="16" fill="#6FE3C1" fill-opacity="0.07" stroke="#6FE3C1" stroke-opacity="0.30"/>
      <circle cx="951" cy="163" r="3" fill="#6FE3C1"/>
      <text x="962" y="169" font-size="15" font-weight="700" fill="#DFF7EF">① 感知</text>
      <text x="962" y="189" font-size="10.5" fill="#87A99F">内感受 · 输入</text>
    </g>
    <g>
      <rect x="1081" y="252" width="158" height="58" rx="16" fill="#FF8FA8" fill-opacity="0.07" stroke="#FF8FA8" stroke-opacity="0.30"/>
      <circle cx="1101" cy="272" r="3" fill="#FF8FA8"/>
      <text x="1112" y="278" font-size="15" font-weight="700" fill="#F7DCE2">② 情绪</text>
      <text x="1112" y="298" font-size="10.5" fill="#B08A95">价值 · 注意</text>
    </g>
    <g>
      <rect x="1024" y="429" width="158" height="58" rx="16" fill="#8A9BFF" fill-opacity="0.07" stroke="#8A9BFF" stroke-opacity="0.30"/>
      <circle cx="1044" cy="449" r="3" fill="#8A9BFF"/>
      <text x="1055" y="455" font-size="15" font-weight="700" fill="#E0E4FA">③ 执行</text>
      <text x="1055" y="475" font-size="10.5" fill="#8B93BF">工作记忆 · 推演</text>
    </g>
    <g>
      <rect x="838" y="429" width="158" height="58" rx="16" fill="#FFB262" fill-opacity="0.07" stroke="#FFB262" stroke-opacity="0.30"/>
      <circle cx="858" cy="449" r="3" fill="#FFB262"/>
      <text x="869" y="455" font-size="15" font-weight="700" fill="#F7E4D2">④ 叙事</text>
      <text x="869" y="475" font-size="10.5" fill="#B99B7F">自我 · 预测</text>
    </g>
    <g>
      <rect x="781" y="252" width="158" height="58" rx="16" fill="#5FC8FF" fill-opacity="0.07" stroke="#5FC8FF" stroke-opacity="0.30"/>
      <circle cx="801" cy="272" r="3" fill="#5FC8FF"/>
      <text x="812" y="278" font-size="15" font-weight="700" fill="#D9EEFA">⑤ 表达</text>
      <text x="812" y="298" font-size="10.5" fill="#85A6BD">语言 · 社会</text>
    </g>

    <text x="1010" y="545" text-anchor="middle" font-size="12.5" fill="#8FA0C8" letter-spacing="0.5">五区并行交互 · 双向闭环 · 人格作为先验</text>
    <text x="1010" y="566" text-anchor="middle" font-size="11.5" fill="#6F7E9F" letter-spacing="0.4">四阀门：注意 · 解释 · 情绪 · 目标</text>
  </g>
</svg>